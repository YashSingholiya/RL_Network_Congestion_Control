[General]
network = CongestionNet
cmdenv-express-mode = true
cmdenv-performance-display = false
cmdenv-status-frequency = 1000s
record-eventlog = false
**.scalar-recording = false
**.vector-recording = false
sim-time-limit = 600s            # safety net only; the bridge ends the episode after 400 monitoring intervals

[Config Bridge]
description = "Co-simulation with the Python environment (the port is passed on the command line)"
**.bridge.host = "127.0.0.1"
**.bridge.port = 5555

[Config Record]
description = "Same as Bridge, but records result vectors (.vec) and the eventlog (.elog) for the OMNeT++ IDE"
extends = Bridge
**.vector-recording = true
**.scalar-recording = true
record-eventlog = true
result-dir = results
